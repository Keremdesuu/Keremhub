# Mevcut nginx server { } bloğunun içine ekle. .env içindeki NEXT_PUBLIC_BASE_PATH ile aynı: /xxxkerem
location /xxxkerem/ {
    client_max_body_size 200m;    # görsel yükleme için
    proxy_pass http://127.0.0.1:3300;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;          # video akışı için
    proxy_read_timeout 3600s;
}
