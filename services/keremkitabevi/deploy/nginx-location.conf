# Keremhub'ın nginx server { } bloğuna ekle.
# proxy_pass'te yol belirtilmediği için /keremkitabevi öneki Next.js'e aynen gider (basePath ile eşleşir).
location /keremkitabevi/ {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Büyük kitap/PDF indirmeleri diske tamponlanmadan akıtılsın; Range istekleri çalışsın
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 120s;
}

# /keremkitabevi (sondaki / olmadan) da çalışsın
location = /keremkitabevi {
    return 301 /keremkitabevi/;
}
