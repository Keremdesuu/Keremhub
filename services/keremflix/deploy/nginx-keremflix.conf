# Keremflix: 192.168.1.240/keremflix altında açılır.
# Uygulama yalnızca 127.0.0.1:3200'de dinler; dışarıdan sadece nginx üzerinden erişilir.
# Bu dosya /etc/nginx/keremhub.d/keremflix.conf olarak kurulur (ana nginx sunucu bloğu içine eklenir).

# /keremflix ve /keremflix/... isteklerini karşılar. Sondaki eğik çizgi yönlendirmesini Next.js yapar.
location ~ ^/keremflix(/|$) {
    # URI bilerek verilmedi: yol olduğu gibi (/keremflix/...) uygulamaya gider, basePath bunu bekler
    proxy_pass http://127.0.0.1:3200;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Video akışı (Range destekli) ve uzun taramalar için
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
