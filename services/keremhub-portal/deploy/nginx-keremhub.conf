# keremhub: 192.168.1.240 adresine gelen her isteği karşılar.
# Ana portal 3000. portta çalışır. Diğer siteler için /etc/nginx/keremhub.d/ altına
# birer .conf dosyası bırakmak yeterli (örnek: keremhub.d/ornek.conf.disabled).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 50m;

    include /etc/nginx/keremhub.d/*.conf;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
